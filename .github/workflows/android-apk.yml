name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, native-android]
    paths:
      - "app/**"
      - "native/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/NATIVE-ANDROID-PORT.md"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android port
        uses: actions/checkout@v4

      - name: Check out upstream StykAnimate source
        uses: actions/checkout@v4
        with:
          repository: filippocalippo/StykAnimate-App
          path: upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Set up pinned Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/android-bridge

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test native bridge against an upstream Pivot fixture
        run: cargo test --manifest-path native/android-bridge/Cargo.toml

      - name: Build upstream Rust engine for Android ABIs
        working-directory: native/android-bridge
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o ../../app/src/main/jniLibs \
            build --release
      - name: Package original upstream assets and notices
        run: |
          mkdir -p app/src/main/assets/upstream
          cp -a upstream/assets/. app/src/main/assets/upstream/
          cp upstream/LICENSE app/src/main/assets/upstream/LICENSE
          cp upstream/THIRD_PARTY_NOTICES.md app/src/main/assets/upstream/THIRD_PARTY_NOTICES.md

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify native APK contains all requested ABIs
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libstykanimate_android.so
          test -s app/src/main/jniLibs/armeabi-v7a/libstykanimate_android.so
          test -s app/src/main/jniLibs/x86_64/libstykanimate_android.so

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK has native libraries and no WebView integration
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libstykanimate_android.so'
          if grep -R -n -E 'android\\.webkit\\.WebView|WebViewAssetLoader|loadUrl\\(' app/src/main; then
            echo "WebView code is not allowed in the native Android app."
            exit 1
          fi

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stykanimate-android-native-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
