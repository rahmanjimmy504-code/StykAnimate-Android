[package]
name = "stykanimate-android-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "stykanimate_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
styk-engine = { path = "../../upstream/engine/crates/styk-engine" }
styk-raster = { path = "../../upstream/engine/crates/styk-raster" }
styk-render = { path = "../../upstream/engine/crates/styk-render", default-features = false }
